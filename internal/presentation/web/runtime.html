<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{border:0;position:absolute;inset:0;width:100%;height:100%}.screen{position:absolute;box-sizing:border-box;pointer-events:none}.caption{position:absolute;white-space:pre-wrap;pointer-events:none}</style></head><body><script>
let config, frames=[], images=new Map();
const waitImage=im=>im.decode();
async function createFrame(url){const f=document.createElement('iframe'); f.src=url; document.body.append(f);await new Promise((resolve,reject)=>{f.onload=resolve;f.onerror=()=>reject(Error('template load failed'))});await f.contentDocument.fonts.ready;await Promise.all([...f.contentDocument.images].map(waitImage));const hide=f.contentDocument.createElement('style');hide.textContent='[data-slot]{visibility:hidden!important}';f.contentDocument.head.append(hide);return f;}
window.initialize=async function(c){config=c;c.text=c.text||[];for(let i=0;i<c.events.length;i++){const f=await createFrame(c.events[i].url);frames.push(f);f.style.opacity='0'; const w=f.contentWindow,m=w.backstageTemplate;if(!m||m.version!==1||typeof w.render!=='function')throw Error('template requires backstageTemplate version 1 and render(context)');const e=c.events[i];if(e.layout && (!m.layouts||!Array.isArray(m.layouts[e.layout])))throw Error('unknown layout '+e.layout);for(const slot of Object.keys(e.slots||{}))if(!m.layouts[e.layout].includes(slot))throw Error('unknown slot '+slot);await update(i,e.at);for(const slot of Object.keys(e.slots||{}))if(!find(f,'data-slot',slot))throw Error('missing data-slot '+slot);}
 for(const caption of c.text){for(let i=0;i<c.events.length;i++){const e=c.events[i],end=c.events[i+1]?.at??c.duration;if(caption.at<end&&caption.end>e.at&&!find(frames[i],'data-caption-slot',caption.slot))throw Error('unknown caption slot '+caption.slot)}}
};
function find(f,attr,value){return [...f.contentDocument.querySelectorAll('['+attr+']')].find(e=>e.getAttribute(attr)===value)}
async function update(i,t){const f=frames[i],w=f.contentWindow,e=config.events[i];const ctx={time:t,localTime:Math.max(0,t-e.at),layout:e.layout,parameters:config.parameters,narration:e.narration||{}};await w.render(ctx);for(const a of f.contentDocument.getAnimations()){a.pause();a.currentTime=ctx.localTime*1000;}for(const svg of f.contentDocument.querySelectorAll('svg')){if(svg.pauseAnimations){svg.pauseAnimations();svg.setCurrentTime(ctx.localTime);}}await f.contentDocument.fonts.ready;await Promise.all([...f.contentDocument.images].map(waitImage));}
function geometry(i,track){const e=config.events[i];const pair=Object.entries(e.slots||{}).find(([,id])=>id===track);if(!pair)return null;const el=find(frames[i],'data-slot',pair[0]);if(!el)throw Error('missing slot '+pair[0]);const r=el.getBoundingClientRect(),s=frames[i].contentWindow.getComputedStyle(el);const bl=parseFloat(s.borderLeftWidth),bt=parseFloat(s.borderTopWidth),br=parseFloat(s.borderRightWidth),bb=parseFloat(s.borderBottomWidth);return {x:r.x,y:r.y,w:r.width,h:r.height,radius:parseFloat(s.borderTopLeftRadius)||0,fit:el.dataset.fit||'contain',border:s.border,background:s.background,shadow:s.boxShadow};}
window.draw=async function(state){const t=state.time;let i=0;while(i+1<config.events.length&&config.events[i+1].at<=t)i++;const e=config.events[i],duration=e.transition?.duration||0;const blend=i>0&&duration>0&&t<e.at+duration;const progress=blend?(t-e.at)/duration:1;
 await update(i,t);if(blend)await update(i-1,t);
 frames.forEach((f,k)=>f.style.opacity=k===i?String(progress):(blend&&k===i-1?String(1-progress):'0'));
 document.querySelectorAll('.screen,.caption').forEach(e=>e.remove());
 for(const [id,data] of Object.entries(state.images)){let im=images.get(id);if(!im){im=new Image();images.set(id,im)}im.src='data:image/png;base64,'+data;await im.decode();const now=geometry(i,id),old=blend?geometry(i-1,id):null;const put=(g,opacity)=>{if(!g||opacity<=0)return;const out=document.createElement('div');out.className='screen';Object.assign(out.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px',borderRadius:g.radius+'px',overflow:'hidden',border:g.border,background:g.background,boxShadow:g.shadow,opacity:String(opacity)});const picture=im.cloneNode();Object.assign(picture.style,{width:'100%',height:'100%',objectFit:g.fit,display:'block'});out.append(picture);document.body.append(out)};
 if(blend&&e.transition.effect==='morph'){const a=old||now,b=now||old;if(a&&b){const g={fit:b.fit,border:b.border,background:b.background,shadow:b.shadow};for(const k of ['x','y','w','h','radius'])g[k]=a[k]+(b[k]-a[k])*progress;put(g,old&&now?1:now?progress:1-progress)}}else if(blend){put(old,1-progress);put(now,progress)}else put(now,1);
 }
 for(const [idx,opacity] of (blend?[[i-1,1-progress],[i,progress]]:[[i,1]])){const groups=new Map();for(const c of config.text)if(t>=c.at&&t<c.end){if(!groups.has(c.slot))groups.set(c.slot,[]);groups.get(c.slot).push(c.text)}for(const [slot,texts] of groups){const el=find(frames[idx],'data-caption-slot',slot);if(!el)continue;const r=el.getBoundingClientRect(),s=frames[idx].contentWindow.getComputedStyle(el),out=document.createElement('div');out.className='caption';out.textContent=texts.join('\n');Object.assign(out.style,{left:r.x+'px',top:r.y+'px',width:r.width+'px',height:r.height+'px',font:s.font,color:s.color,textAlign:s.textAlign,lineHeight:s.lineHeight,background:s.backgroundColor,opacity:String(opacity)});document.body.append(out)}}
 await Promise.all([...document.querySelectorAll('.screen img')].map(waitImage));await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
};
</script></body></html>

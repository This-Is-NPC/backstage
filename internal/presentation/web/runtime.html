<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{border:0;position:absolute;inset:0;width:100%;height:100%}.screen{position:absolute;box-sizing:border-box;pointer-events:none}.caption{position:absolute;white-space:pre-wrap;pointer-events:none}</style></head><body><script>

function find(f,attr,value){return [...f.contentDocument.querySelectorAll('['+attr+']')].find(e=>e.getAttribute(attr)===value)}

function snapDim(x,span){const x0=Math.round(x),x1=Math.round(x+span);return [x0,x1-x0];}

function screenBox(box,opacity){
  const s={left:box.x+'px',top:box.y+'px',width:box.w+'px',height:box.h+'px',borderRadius:(box.rtl||0)+'px',overflow:'hidden',borderLeft:box.borderLeft||'',borderRight:box.borderRight||'',borderTop:box.borderTop||'',borderBottom:box.borderBottom||'',background:box.background,boxShadow:box.shadow};

function containPad(srcW,srcH,cw,ch){
  if(srcW<1||srcH<1||cw<1||ch<1) return [cw,ch,0,0];

function coverPad(srcW,srcH,cw,ch){
  if(srcW<1||srcH<1||cw<1||ch<1) return [cw,ch,0,0];

function contentSnap(g){

function cssPx(v){const s=String(v).trim().toLowerCase();return s==='0'||/^-?\d+(\.\d+)?px$/.test(s)}
function geometry(i,track){const e=config.events[i];const pair=Object.entries(e.slots||{}).find(([,id])=>id===track);if(!pair)return null;const el=find(frames[i],'data-slot',pair[0]);if(!el)throw Error('missing slot '+pair[0]);const r=el.getBoundingClientRect(),s=frames[i].contentWindow.getComputedStyle(el);const bl=parseFloat(s.borderLeftWidth)||0,bt=parseFloat(s.borderTopWidth)||0,br=parseFloat(s.borderRightWidth)||0,bb=parseFloat(s.borderBottomWidth)||0;const rtl=parseFloat(s.borderTopLeftRadius)||0,rtr=parseFloat(s.borderTopRightRadius)||0,rbr=parseFloat(s.borderBottomRightRadius)||0,rbl=parseFloat(s.borderBottomLeftRadius)||0;const radiusPx=cssPx(s.borderTopLeftRadius)&&cssPx(s.borderTopRightRadius)&&cssPx(s.borderBottomRightRadius)&&cssPx(s.borderBottomLeftRadius);return {x:r.x,y:r.y,w:r.width,h:r.height,rtl,rtr,rbr,rbl,radiusPx,fit:el.dataset.fit||'contain',borderLeft:s.borderLeft,borderRight:s.borderRight,borderTop:s.borderTop,borderBottom:s.borderBottom,background:s.background,shadow:s.boxShadow,bl,bt,br,bb};}
function dynamicURL(u){const s=String(u).toLowerCase(); return s.includes('.gif')||s.includes('.apng')||s.includes('.webp');}
window.probe=async function(state){
  const t=state.time; let i=0; while(i+1<config.events.length&&config.events[i+1].at<=t)i++;

  const boxes=[];
  for(const slot of slotNames(i)){const id=e.slots&&e.slots[slot]; if(!id) continue; const got=geometry(i,id); if(!got) continue; boxes.push(Object.assign({},got,{slot,track:id}));}

  const extra=[];
  const pushURL=u=>{if(dynamicURL(u)) dyn.push(String(u));};
  for(const im of doc.images) pushURL(im.currentSrc||im.src);

    const bg=el.ownerDocument.defaultView.getComputedStyle(el).backgroundImage; if(bg&&bg!=='none') pushURL(bg);
    const row=[el.scrollTop,el.scrollLeft];
    const W=doc.defaultView;

      row.push(el.value);
      if(el instanceof W.HTMLInputElement) row.push(el.checked, el.indeterminate);
      if(el instanceof W.HTMLSelectElement) row.push([...el.selectedOptions].map(o=>o.index));
    }
    extra.push(row);
  }

  const focus=[];

    for(let n=ae;n&&n!==doc.documentElement;n=n.parentElement){
      const i=n.parentElement?[...n.parentElement.children].indexOf(n):0;
      focus.push(n.tagName+':'+i);

    const timing=a.effect&&a.effect.getComputedTiming?a.effect.getComputedTiming():null;

window.draw=async function(state){const t=state.time;let i=0;while(i+1<config.events.length&&config.events[i+1].at<=t)i++;const e=config.events[i],duration=e.transition?.duration||0;const blend=i>0&&duration>0&&t<e.at+duration;const progress=blend?(t-e.at)/duration:1;

 for(const id of orderedTrackIDs(i, blend?i-1:-1)){const data=state.images[id]; if(!data) continue; let im=images.get(id);if(!im){im=new Image();images.set(id,im)}im.src='data:image/png;base64,'+data;await im.decode();const now=geometry(i,id),old=blend?geometry(i-1,id):null;const put=(g,opacity)=>{if(!g||opacity<=0)return;const box=blend?g:snapGeo(g);const out=document.createElement('div');out.className='screen';Object.assign(out.style,screenBox(box,opacity));const picture=im.cloneNode();if(!blend)fitPicture(picture,im.naturalWidth,im.naturalHeight,g,box);else Object.assign(picture.style,{width:'100%',height:'100%',objectFit:g.fit,display:'block'});out.append(picture);document.body.append(out)};

 await Promise.all([...document.querySelectorAll('.screen img')].map(waitImage));await document.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
};
window.drawLayer=async function(state){
  const t=state.time, layer=state.layer;
  let i=0; while(i+1<config.events.length&&config.events[i+1].at<=t)i++;
  await update(i,t);
  if(layer==='above'){
    document.documentElement.style.background='transparent';
    document.body.style.background='transparent';
  }else{
    document.documentElement.style.background='';
    document.body.style.background='';
  }
  frames.forEach((f,k)=>f.style.opacity=(layer==='below'&&k===i)?'1':'0');
  document.querySelectorAll('.screen,.caption').forEach(n=>n.remove());
  if(layer==='below'){
    const e=config.events[i];
    for(const slot of slotNames(i)){
      const id=e.slots&&e.slots[slot]; if(!id) continue;
      const g=snapGeo(geometry(i,id)); if(!g) continue;

window.drawTimed = async (state) => { const t0 = performance.now(); await window.draw(state); return performance.now() - t0; };
</script></body></html>
